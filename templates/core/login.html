<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign In — BusPass</title>
{% load static %}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="bus-icon">🚌</div>
      <h1>BusPass</h1>
      <p>College Bus Pass System</p>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account to continue</p>
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}error{% else %}success{% endif %}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">Sign In →</button>
    </form>
    <p style="text-align:center;margin-top:20px;color:#6b7280;font-size:13px;">
      Don't have an account? <a href="{% url 'register' %}">Register here</a>
    </p>
    <div style="margin-top:16px;padding:12px;background:#f9fafb;border-radius:8px;font-size:12px;color:#6b7280;">
      <strong>Admin login:</strong> username: <code>admin</code> | password: <code>admin123</code>
    </div>
  </div>
</div>
</body>
</html>
