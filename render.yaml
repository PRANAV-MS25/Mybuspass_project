services:
  # ── Web Service (Django) ───────────────────────────────────────────────────
  - type: web
    name: buspass-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn buspass_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure secret
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: buspass-db
          property: connectionString

# ── PostgreSQL Database ────────────────────────────────────────────────────────
databases:
  - name: buspass-db
    databaseName: buspass
    user: buspass_user
    plan: free
